name: re-tired-hearts

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-rth}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Copiez .env.example en .env et renseignez DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-re_tired_hearts}
    ports:
      - "${DATABASE_PORT:-5442}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build: ./api
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-rth}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-re_tired_hearts}
      DATABASE_LOGGING: ${DATABASE_LOGGING:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?Copiez .env.example en .env et renseignez JWT_SECRET}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    depends_on:
      # PostgreSQL doit être prêt avant que les migrations ne soient jouées.
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  db-data:
