server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # L'API NestJS est jointe par son nom de service Docker Compose.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers produits par Vite : leur nom contient une empreinte du contenu (index-BPsfNuas.css),
    # il change à chaque modification. On peut donc les garder un an dans le cache du navigateur.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Application monopage : toute autre URL renvoie index.html, jamais mis en cache durablement
    # pour que chaque visite charge les noms de fichiers à jour.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
